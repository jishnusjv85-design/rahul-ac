<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC-MECH Demos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .sites {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    a {
      display: block;
      padding: 40px 20px;
      background: white;
      text-decoration: none;
      color: #111;
      font-size: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    a:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

<h1>Website Demos</h1>

<div class="sites">
  <a href="/meptech/">MEP Tech</a>
  <a href="/cooltech/">Cool Tech</a>
  <a href="/fixly/">Fixly</a>
</div>

</body>
</html>
